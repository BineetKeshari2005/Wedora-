version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wedora_user
      POSTGRES_PASSWORD: wedora_password
      POSTGRES_DB: wedora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: wedora_ai_service
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
